<text x="464.5" y="21" fill="#a6adc8" font-size="12" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">sudo eduwifi</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#cdd6f4" xml:space="preserve">
<text x="20" y="70"><tspan>Connect to eduroam:</tspan></text>
<text x="20" y="90"><tspan>  iwctl station wlan0 scan</tspan></text>
<text x="20" y="110"><tspan>  iwctl station wlan0 connect &quot;eduroam&quot;</tspan></text>
<text x="20" y="130"></text>
<text x="20" y="150"><tspan>Your credentials are saved, so iwctl won&#x27;t ask for them.</tspan></text>
<text x="20" y="170"><tspan>If it fails, check the log with: </tspan><tspan font-weight="bold" fill="#ffffff">journalctl -u iwd -f</tspan></text>
